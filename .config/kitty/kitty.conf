# Font
font_family      family="CaskaydiaCove Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto

# Window
hide_window_decorations no

# Aesthetics
cursor_shape          block
cursor_blink_interval 0
shell_integration     no-cursor
enable_audio_bell     no

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Search kitten for kitty
# https://github.com/trygveaa/kitty-kitten-search#installation
map kitty_mod+/      launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
